[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-curate"
version = "0.1.0"
description = "Turn an OpenAPI spec into a high-quality, curated MCP server — with an eval harness that proves curation works."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.27,<2",
    "pyyaml>=6,<7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only the eval harness and optional --llm-descriptions need an LLM client.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-curate = "mcp_curate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
